<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="timeBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="timeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#timeBadgeGrad)" stroke="#fef08a" stroke-width="2.5" filter="url(#timeShadow)" />
  <circle cx="60" cy="60" r="46" fill="#7f1d1d" stroke="#fef08a" stroke-width="1" stroke-dasharray="2,3" />
  <!-- Clock Hands -->
  <line x1="60" y1="60" x2="60" y2="34" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <line x1="60" y1="60" x2="78" y2="60" stroke="#fde047" stroke-width="3" stroke-linecap="round" />
  <circle cx="60" cy="60" r="4" fill="#ffffff" />
  <!-- Banner Label -->
  <rect x="22" y="76" width="76" height="22" rx="4" fill="#fef08a" stroke="#b45309" stroke-width="1" />
  <text x="60" y="92" font-size="11" font-weight="900" fill="#991b1b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" letter-spacing="1">TIME</text>
</svg>

