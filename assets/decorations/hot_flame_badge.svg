<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="45%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <radialGradient id="innerFlameGlow" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>
    <filter id="flameShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7f1d1d" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Flame Shape Outer -->
  <path d="M60,8 C70,26 86,34 86,56 C86,76 74,96 60,112 C46,96 34,76 34,56 C34,36 50,22 60,8 Z" fill="url(#fireGrad)" stroke="#fef08a" stroke-width="2" filter="url(#flameShadow)" />
  <!-- Inner Flame Heart -->
  <path d="M60,42 C66,54 74,62 74,76 C74,88 66,98 60,106 C54,98 46,88 46,76 C46,62 54,54 60,42 Z" fill="url(#innerFlameGlow)" />
  <!-- HOT Text Pill -->
  <rect x="26" y="66" width="68" height="24" rx="12" fill="#991b1b" stroke="#fef08a" stroke-width="2" />
  <text x="60" y="83" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" letter-spacing="1">HOT</text>
</svg>

