<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Disc / Laurel -->
  <circle cx="60" cy="60" r="50" fill="#1e1b4b" opacity="0.85" stroke="url(#crownGrad)" stroke-width="2.5" />
  <!-- Crown Path -->
  <path d="M30,78 L34,46 L48,60 L60,36 L72,60 L86,46 L90,78 Z" fill="url(#crownGrad)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Crown Base Band -->
  <rect x="30" y="78" width="60" height="10" rx="3" fill="#d97706" stroke="#78350f" stroke-width="1" />
  <!-- Crown Jewels / Dots -->
  <circle cx="34" cy="44" r="3.5" fill="#fef08a" />
  <circle cx="60" cy="34" r="4.5" fill="#fef08a" />
  <circle cx="86" cy="44" r="3.5" fill="#fef08a" />
  <circle cx="60" cy="83" r="3" fill="url(#gemGrad)" />
  <circle cx="45" cy="83" r="2.5" fill="#38bdf8" />
  <circle cx="75" cy="83" r="2.5" fill="#38bdf8" />
  <!-- Sparkles -->
  <path d="M85,25 L86.5,20 L88,25 L93,26.5 L88,28 L86.5,33 L85,28 L80,26.5 Z" fill="#ffffff" />
</svg>
