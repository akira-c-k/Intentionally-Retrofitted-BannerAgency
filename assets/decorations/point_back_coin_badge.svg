<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <radialGradient id="coinFace" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="60%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <filter id="coinShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#78350f" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Outer Golden Rim -->
  <circle cx="60" cy="60" r="54" fill="url(#coinGrad)" stroke="#fef08a" stroke-width="2" filter="url(#coinShadow)" />
  <circle cx="60" cy="60" r="45" fill="url(#coinFace)" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" />
  <!-- Sparkles -->
  <path d="M96,24 L98,18 L100,24 L106,26 L100,28 L98,34 L96,28 L90,26 Z" fill="#ffffff" />
  <!-- P / POINT UP text -->
  <text x="60" y="56" font-size="24" font-weight="900" fill="#78350f" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">P</text>
  <rect x="26" y="68" width="68" height="20" rx="4" fill="#78350f" />
  <text x="60" y="83" font-size="11" font-weight="900" fill="#fef08a" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" letter-spacing="0.5">POINT UP</text>
</svg>

