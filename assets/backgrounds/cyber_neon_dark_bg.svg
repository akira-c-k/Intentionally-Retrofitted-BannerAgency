<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b071a" />
      <stop offset="50%" stop-color="#180e36" />
      <stop offset="100%" stop-color="#05030a" />
    </linearGradient>
    <radialGradient id="neonMagenta" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#db2777" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0b071a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="neonCyan" cx="80%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#05030a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gridLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <rect width="600" height="500" fill="url(#cyberBg)" />
  <circle cx="120" cy="150" r="280" fill="url(#neonMagenta)" />
  <circle cx="480" cy="380" r="250" fill="url(#neonCyan)" />
  <!-- Diagonal glowing laser accents -->
  <line x1="0" y1="360" x2="600" y2="280" stroke="url(#gridLine)" stroke-width="1.5" />
  <line x1="0" y1="400" x2="600" y2="320" stroke="url(#gridLine)" stroke-width="1" />
  <circle cx="160" cy="120" r="3" fill="#f472b6" opacity="0.8" />
  <circle cx="440" cy="340" r="3" fill="#38bdf8" opacity="0.8" />
</svg>

