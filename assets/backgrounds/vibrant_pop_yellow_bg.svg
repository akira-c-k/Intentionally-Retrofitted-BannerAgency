<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="popYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <radialGradient id="centerBurst" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="500" fill="url(#popYellowGrad)" />
  <circle cx="300" cy="200" r="300" fill="url(#centerBurst)" />
  <!-- Pop dynamic circles & accents -->
  <circle cx="80" cy="100" r="50" fill="#ffffff" opacity="0.25" />
  <circle cx="520" cy="140" r="70" fill="#ea580c" opacity="0.12" />
  <circle cx="480" cy="420" r="110" fill="#ffffff" opacity="0.2" />
  <circle cx="120" cy="410" r="80" fill="#f97316" opacity="0.15" />
  <!-- Dynamic rays / polygon shards -->
  <polygon points="300,200 180,0 240,0" fill="#ffffff" opacity="0.12" />
  <polygon points="300,200 360,0 420,0" fill="#ffffff" opacity="0.12" />
  <polygon points="300,200 600,100 600,160" fill="#ffffff" opacity="0.12" />
  <polygon points="300,200 600,280 600,340" fill="#ffffff" opacity="0.12" />
  <polygon points="300,200 0,120 0,180" fill="#ffffff" opacity="0.12" />
</svg>

