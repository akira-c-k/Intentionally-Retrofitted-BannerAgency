<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>
  </defs>
  <!-- Hexagon Outer -->
  <polygon points="100,18 168,57 168,143 100,182 32,143 32,57" fill="url(#hexGrad)" />
  <!-- Isometric Cube / Apex Node inside -->
  <polygon points="100,52 140,75 100,98 60,75" fill="url(#innerGlow)" opacity="0.95" />
  <polygon points="60,75 100,98 100,146 60,123" fill="#ffffff" opacity="0.75" />
  <polygon points="100,98 140,75 140,123 100,146" fill="#ffffff" opacity="0.55" />
